<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="./liveIcon.png">
  <title>OPVTT · LIVE</title>
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./player.css">
  <script src="/player.js" defer></script>
</head>
<body data-live="false">
<main>
  <section class="player" id="player" tabindex="-1" aria-label="Room broadcast">
    <video id="stream" playsinline autoplay muted></video>
    <div class="broadcast-fade" id="broadcast-fade" aria-hidden="true"></div>

    <div class="overlay" id="overlay">
      <div class="spinner" id="spinner"></div>
      <p id="status" role="status">Connecting to the host…</p>
    </div>

    <button class="unmute" id="unmute" type="button" hidden>
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
      Tap to hear audio
    </button>

    <div class="controls" id="controls">
      <button class="icon-btn" id="play" type="button" aria-label="Pause">
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5v14M17 5v14"/></svg>
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>
      </button>
      <button class="icon-btn" id="mute" type="button" aria-label="Mute">
        <svg class="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="i-muted" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
      </button>
      <input id="volume" type="range" min="0" max="1" step="0.02" value="1" aria-label="Volume">
      <span class="spacer"></span>
      <button class="icon-btn" id="fs" type="button" aria-label="Fullscreen">
        <svg class="i-enter" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <svg class="i-exit" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
    </div>
  </section>
</main>
</body>
</html>
